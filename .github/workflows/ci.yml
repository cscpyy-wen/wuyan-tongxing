name: industrial-verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: industrial-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version

      - name: Install JDK 21 for the public debug build
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned package manager
        run: npm install --global pnpm@11.19.0

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Install China preview deployment dependencies
        run: npm ci --prefix deploy/tencent-cloudbase

      - name: Install E2E browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full engineering acceptance
        run: pnpm verify:ci

      - name: Build unsigned-for-release public debug APK
        run: pnpm build:android

      - name: Audit production dependency graph
        run: pnpm audit --prod --audit-level moderate

      - name: Audit China preview deployment dependency graph
        run: npm --prefix deploy/tencent-cloudbase audit --audit-level moderate

      - name: Regenerate supply-chain inventory
        run: pnpm supply-chain

      - name: Require deterministic generated evidence
        run: git diff --exit-code -- docs/sbom.cdx.json docs/third-party-licenses.json
