name: 功能建议
description: 提议一个范围清晰、符合隐私与医学边界的改进
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请描述要解决的问题，不要提交真实个人健康数据、凭证或密钥。本项目不提供诊断、处方、个体化用药剂量或疗效保证。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到什么问题？请避免包含可识别个人的信息。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述最小可行方案及用户可观察到的行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与范围外事项
      description: 可选。说明考虑过的替代方案，以及这次建议明确不包含什么。
  - type: dropdown
    id: area
    attributes:
      label: 建议领域
      options:
        - 用户体验
        - 戒烟教育内容
        - 隐私与安全
        - 可访问性
        - 工程与开发体验
        - 其他
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据与安全边界
      description: 如涉及医学、健康或戒烟干预主张，请附权威来源、版本或日期、稳定链接，并说明证据支持与不支持什么。
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 本建议不含真实个人健康数据、凭证或密钥。
          required: true
        - label: 如涉及医学或健康内容，我已附可核查证据，且未声称已经完成医学审核或获得机构认可。
          required: true
