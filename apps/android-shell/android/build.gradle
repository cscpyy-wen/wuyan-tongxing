// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Kotlin 1.8 merged the former jdk7/jdk8 artifacts into kotlin-stdlib.
    // Some AndroidX test dependencies still request the 1.6.21 split jars;
    // keeping the whole family on one version prevents duplicate classes when
    // Gradle builds every library androidTest variant, not only :app:.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin'
                && details.requested.name in ['kotlin-stdlib', 'kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
                details.useVersion '1.8.22'
                details.because 'Keep the merged Kotlin stdlib family aligned for Android test variants'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
